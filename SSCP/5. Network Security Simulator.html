<script>
const D=[{"n": "Defense in Depth & Device Placement", "d": "Layered trust domains: physical perimeter, perimeter network (DMZ), LAN, hosts, applications, data. A firewall sits on every connection crossing a domain boundary.", "f": {"DMZ": "Demilitarized Zone", "LAN": "Local Area Network", "ACL": "Access Control List"}, "nodes": [["X", "Internet", 50, 150], ["P", "Perimeter FW", 170, 150], ["W", "DMZ Web App", 290, 150], ["I", "Inner FW", 410, 150], ["H", "Host / App", 530, 150], ["S", "Data Servers", 650, 150]], "steps": [["X", "P", "Public request reaches the outer perimeter; facilities/physical security already limits site access.", "info"], ["P", "W", "Perimeter firewall permits only web ports to trusted web apps in the DMZ.", "ok"], ["W", "I", "Web app needs data, so the request must cross the inner firewall.", "info"], ["I", "H", "Only authorised internal users/apps pass; the host's own firewall adds another check.", "ok"], ["H", "S", "Application queries servers: final layer uses access control and encryption.", "ok"], ["X", "I", "Attacker tries to skip the DMZ: dropped. No single point of failure.", "bad"]], "pro": ["No single point of failure", "Contains breaches to one zone", "Maps controls to each threat surface"], "con": ["More devices to manage", "Rules need constant revalidation", "Added latency and cost"], "app": {"c": "Banks and e-commerce: DMZ web tier, app tier, database tier.", "d": "Classified enclaves separated by cross-domain guards and multiple perimeters.", "o": "Hospitals, universities, utilities (IT/OT segmentation)."}}, {"n": "Firewalls: Stateless, Stateful, Shallow", "d": "Static packet filters judge each packet alone; stateful firewalls track sessions and open ports dynamically; shallow inspection reads only L2-4 headers.", "f": {"FTP": "File Transfer Protocol", "TCP": "Transmission Control Protocol", "UDP": "User Datagram Protocol", "SYN": "Synchronize", "ACK": "Acknowledgement", "OSI": "Open Systems Interconnection", "MAC": "Media Access Control", "DPI": "Deep Packet Inspection"}, "nodes": [["C", "Client", 50, 150], ["F", "Firewall", 300, 150], ["S", "Server", 560, 150]], "steps": [["C", "F", "Static filter: each packet checked alone against fixed rules (e.g. block port 79 'finger'). No session memory.", "info"], ["F", "S", "Stateful: outbound SYN from inside is allowed and a state-table entry is created.", "ok"], ["S", "F", "SYN/ACK matches the entry, so the three-way handshake (SYN, SYN/ACK, ACK) completes.", "ok"], ["S", "C", "FTP data connection back to client port 1067 is allowed as part of FTP; a static filter would block it.", "ok"], ["S", "F", "Unsolicited packet with no state entry is dropped; idle sessions time out.", "bad"]], "pro": ["Static: fast, low overhead", "Stateful: handles dynamic ports safely", "Shallow: cheap, built into routers"], "con": ["Static: cannot open ports temporarily", "Stateful: needs memory/state table", "Shallow: blind to payload"], "app": {"c": "Routers and office/home gateways; enterprise edge firewalls.", "d": "Border gateways and tactical network edges.", "o": "Cloud security groups, school and campus networks."}}, {"n": "Proxies: Circuit, Application, Web", "d": "A proxy splits each session in two (user-proxy, proxy-service), a management-approved man-in-the-middle.", "f": {"AUP": "Acceptable Use Policy", "URL": "Uniform Resource Locator"}, "nodes": [["U", "User", 60, 150], ["P", "Proxy", 360, 150], ["W", "Web Server", 640, 150]], "steps": [["U", "P", "Session 1: the user connects to the proxy and authenticates.", "ok"], ["P", "W", "Session 2: proxy opens a separate connection. Circuit-level just relays; application-level inspects.", "ok"], ["W", "P", "Response is inspected for attacks (e.g. buffer overflow), logged and cached.", "info"], ["P", "U", "Clean content delivered; popular pages served from cache.", "ok"], ["U", "P", "Request to a blocked site is denied and logged (AUP enforcement, evidence).", "bad"]], "pro": ["Deep inspection (application-level)", "Hides internal hosts", "Logging, caching, authentication"], "con": ["Circuit-level does not inspect content", "Application-level adds overhead", "One proxy per protocol"], "app": {"c": "Corporate web gateways (Zscaler, Squid, Blue Coat).", "d": "Controlled internet access and audit logs on classified networks.", "o": "Schools (content filtering), ISPs (caching)."}}, {"n": "Host-Based vs Network-Based Firewalls, Personal & NGFW", "d": "Network firewalls protect whole segments; host firewalls protect one endpoint and block outbound escape. Home networks need both.", "f": {"SOHO": "Small Office/Home Office", "NGFW": "Next-Generation Firewall", "COTS": "Commercial Off-The-Shelf", "ISP": "Internet Service Provider", "IoT": "Internet of Things", "GUI": "Graphical User Interface"}, "nodes": [["I", "Internet", 50, 150], ["N", "Network FW", 210, 150], ["L", "LAN Switch", 370, 150], ["H", "Host FW", 530, 150], ["P", "Processes", 660, 150]], "steps": [["I", "N", "Network firewall inspects all inbound traffic for every device behind it.", "ok"], ["N", "L", "Allowed traffic enters the LAN; alarms go via an out-of-band channel.", "info"], ["L", "H", "Host firewall filters per-process traffic at the endpoint's interface.", "ok"], ["H", "P", "Only permitted processes receive data; hostile software cannot phone home.", "ok"], ["I", "N", "Login attempt to router with default username/password: the top self-inflicted weakness.", "bad"]], "pro": ["Network: one choke point, easy to change", "Host: protects off-network laptops", "NGFW: adds ML threat detection"], "con": ["Network: IoT inside LAN still exposed", "Host: many instances to manage", "Default credentials leave SOHO open"], "app": {"c": "Windows Defender Firewall, Palo Alto/Fortinet NGFW.", "d": "Hardened hosts plus enterprise NGFW.", "o": "Family routers, smart-home hubs, small clinics."}}, {"n": "Wi-Fi Security: WEP → WPA3", "d": "Each protocol fell to attackers until WPA3 (2018) added SAE and forward secrecy.", "f": {"WEP": "Wired Equivalent Privacy", "WPA": "Wi-Fi Protected Access", "TKIP": "Temporal Key Integrity Protocol", "MIC": "Message Integrity Check", "AES": "Advanced Encryption Standard", "CCMP": "Counter Mode CBC-MAC Protocol", "SAE": "Simultaneous Authentication of Equals", "KRACK": "Key Reinstallation Attack", "AP": "Access Point", "RC4": "Rivest Cipher 4", "GCMP": "Galois/Counter Mode Protocol", "ECDH": "Elliptic Curve Diffie-Hellman", "ECDSA": "Elliptic Curve Digital Signature Algorithm", "HMAC": "Hashed Message Authentication Code", "SHA": "Secure Hash Algorithm", "BIP-GMAC": "Broadcast/Multicast Integrity Protocol Galois MAC"}, "nodes": [["C", "Client", 60, 150], ["A", "Access Point", 360, 150], ["X", "Attacker", 640, 150]], "steps": [["X", "A", "WEP (RC4): statistical and known-plaintext attacks decrypt or inject traffic.", "bad"], ["C", "A", "WPA (2003) TKIP+MIC stopgap; WPA2 (2004) AES-CCMP with 802.1X; later broken.", "info"], ["C", "A", "WPA3 (2018): SAE handshake resists offline guessing, no pre-shared key exposure.", "ok"], ["A", "C", "Forward secrecy: fresh session keys, so captured old traffic stays undecryptable.", "ok"], ["X", "A", "Dragonblood (2019) downgrade to WPA2/KRACK: fixed by software updates.", "bad"]], "pro": ["WPA3: forward secrecy, no downgrade", "Enterprise: GCMP-256, HMAC-SHA384, ECDH/ECDSA-384", "Easier-to-remember passwords"], "con": ["Legacy gear must be upgraded", "Public hotspots may not upgrade", "Early SAE flaws (Dragonblood)"], "app": {"c": "Enterprise Wi-Fi (WPA3-Enterprise + RADIUS), retail, airports.", "d": "Secure tactical and base wireless with 802.1X.", "o": "Homes, hospitals, campuses."}}, {"n": "Network Access Control (802.1X)", "d": "Authenticate and posture-check users and devices before they get network access.", "f": {"NAC": "Network Access Control", "IEEE": "Institute of Electrical and Electronics Engineers", "EAP": "Extensible Authentication Protocol", "EAPOL": "EAP over LAN", "RADIUS": "Remote Authentication Dial-In User Service"}, "nodes": [["S", "Supplicant", 60, 150], ["A", "Authenticator", 250, 150], ["R", "Auth Server", 450, 150], ["N", "LAN/Internet", 650, 150]], "steps": [["S", "A", "1. EAPOL: the supplicant presents credentials/certificate to the switch or wireless controller.", "info"], ["A", "R", "2. Authenticator relays EAP via RADIUS/Diameter to the authentication server.", "info"], ["R", "A", "Server checks identity and posture (antivirus, patches, approved software).", "ok"], ["A", "N", "3. Compliant: port opens and the authorised services are granted.", "ok"], ["A", "S", "Non-compliant: denied, or quarantined until fixed.", "bad"]], "pro": ["Only authorised devices connect", "Pre-access compliance screening", "Quarantine option"], "con": ["Certificate lifecycle overhead", "Legacy/IoT devices lack a supplicant", "RADIUS server is critical"], "app": {"c": "Corporate campuses, BYOD (Cisco ISE, Aruba ClearPass).", "d": "Rogue-device blocking on military LANs.", "o": "Universities (eduroam), hospitals."}}, {"n": "Intrusion Detection & Prevention", "d": "IDS senses events and raises alarms; IPS acts: block, reject, or divert.", "f": {"IDS": "Intrusion Detection System", "IPS": "Intrusion Prevention System", "HIDS/HIPS": "Host-based IDS/IPS", "NIDS/NIPS": "Network-based IDS/IPS", "IoC": "Indicator of Compromise", "WAN": "Wide Area Network", "SOC": "Security Operations Center"}, "nodes": [["X", "Internet", 50, 150], ["D", "IDS Sensor", 230, 150], ["P", "IPS", 420, 150], ["H", "Protected Net", 620, 150], ["S", "SOC Analyst", 230, 40], ["Y", "Honeynet", 420, 260]], "steps": [["X", "D", "Event: a packet with suspected malware arrives at the WAN port.", "info"], ["D", "S", "Signal: scanner flags it; rules elevate it to an IoC and alarm the analyst.", "info"], ["D", "P", "Detection triggers the prevention system.", "ok"], ["P", "Y", "Suspicious traffic can be diverted to a honeynet for analysis.", "ok"], ["P", "X", "Packet rejected; source IP/MAC/port blocked.", "bad"], ["P", "H", "Clean traffic continues to the protected network.", "ok"]], "pro": ["Real-time and post-facto detection", "Automated response", "HIDS and NIDS combined"], "con": ["False positives can block good traffic", "Needs tuning and analysts", "Encrypted traffic limits visibility"], "app": {"c": "Managed security services, cloud WAF/IPS.", "d": "Cyber defence centres and mission networks.", "o": "Critical infrastructure (SCADA monitoring), healthcare."}}, {"n": "Data Loss Prevention (DLP)", "d": "Keeps data inside the organisation-controlled environment (IRM/DRM instead controls access to protected material).", "f": {"DLP": "Data Loss Prevention", "IRM": "Information Rights Management", "DRM": "Digital Rights Management"}, "nodes": [["D", "Data Stores", 60, 150], ["L", "DLP Engine", 260, 150], ["U", "User", 440, 150], ["E", "External", 630, 150]], "steps": [["D", "L", "1-4. Define classes, label/tag data, continuously discover and map it.", "info"], ["L", "U", "5. Real-time feedback warns users handling sensitive data.", "info"], ["U", "L", "User tries to email a 'Confidential' file externally.", "info"], ["L", "E", "6. Policy enforced: transfer blocked.", "bad"], ["L", "D", "7. Report on DLP performance.", "info"]], "pro": ["Stops accidental and malicious leaks", "Supports compliance", "Educates users"], "con": ["Classification effort", "False positives", "Hard with encrypted channels"], "app": {"c": "Banks (card data), pharma IP protection.", "d": "Controlled information and export-control enforcement.", "o": "Healthcare (patient records), legal firms."}}, {"n": "Traffic Shaping, SD-WAN & Load Balancing", "d": "Make traffic meet a profile: restrict, queue, police; break out branch traffic locally; spread load.", "f": {"WAN": "Wide Area Network", "SD-WAN": "Software-Defined WAN", "QoS": "Quality of Service"}, "nodes": [["B", "Branch Office", 60, 150], ["W", "SD-WAN Edge", 230, 150], ["T", "Traffic Shaper", 400, 150], ["L", "Load Balancer", 560, 150], ["S", "App Servers", 670, 60], ["I", "Internet", 230, 260]], "steps": [["B", "W", "Branch traffic enters the SD-WAN edge.", "info"], ["W", "I", "Internet-bound traffic breaks out locally, not backhauled to HQ.", "ok"], ["W", "T", "Corporate traffic is classified by bandwidth/application.", "info"], ["T", "L", "Video capped so conferencing stays reliable; excess queued or delayed.", "ok"], ["L", "S", "Requests spread across servers as load fluctuates.", "ok"], ["T", "W", "Abusive flood policed: dropped.", "bad"]], "pro": ["Saves bandwidth", "Supports IDS/IPS/DLP", "Scales with load"], "con": ["Needs network-engineering coordination", "Misconfig throttles real work", "More moving parts"], "app": {"c": "Retail chains and branch networks.", "d": "Bandwidth-constrained field links.", "o": "Telcos, streaming, video-conferencing."}}, {"n": "Unified Threat Management (UTM)", "d": "An all-in-one appliance, cluster or cloud service (SECaaS/SaaS) with one management portal.", "f": {"UTM": "Unified Threat Management", "WAF": "Web Application Firewall", "VPN": "Virtual Private Network", "CTI": "Cyberthreat Intelligence", "SECaaS": "Security as a Service", "SaaS": "Software as a Service"}, "nodes": [["I", "Internet", 50, 150], ["F", "Firewall/WAF", 190, 150], ["P", "IPS", 330, 150], ["A", "AV/Anti-malware", 470, 150], ["W", "Web/Spam Filter", 610, 150], ["U", "Users", 650, 40]], "steps": [["I", "F", "Traffic hits firewall/WAF and VPN termination.", "ok"], ["F", "P", "IPS inspects against signatures and CTI feeds.", "ok"], ["P", "A", "Antivirus/antimalware scans payloads.", "ok"], ["A", "W", "Content filtering and antispam applied.", "ok"], ["W", "U", "Clean traffic delivered; one portal manages everything.", "ok"], ["A", "I", "Malware found: dropped.", "bad"]], "pro": ["Single pane of glass", "Lower cost/complexity", "Cloud option removes appliance work"], "con": ["Single point of failure", "Performance limits with all features on", "Vendor lock-in"], "app": {"c": "SMBs and branches (Fortinet, Sophos).", "d": "Compact deployable kits for remote sites.", "o": "Schools, clinics, retail."}}, {"n": "Remote Access & Zero Trust (Application Proxy)", "d": "Setup: DNS, security groups, IP/routing, certificates, network location server, access servers, then test. ZTA/SDP uses inside-initiated connections with no ingress firewall.", "f": {"ZTA": "Zero Trust Architecture", "SDP": "Software-Defined Perimeter", "DNS": "Domain Name System", "MFA": "Multifactor Authentication"}, "nodes": [["U", "Remote User", 60, 150], ["C", "Cloud App Proxy", 300, 150], ["I", "Identity/Cert", 300, 40], ["A", "Application", 580, 150]], "steps": [["A", "C", "Inside-initiated: the app connects OUT to the broker, so no inbound port is open.", "ok"], ["U", "C", "User meets the application in the cloud and presents MFA/certificate.", "info"], ["C", "I", "Identity, certificate validity and device posture checked.", "info"], ["C", "A", "Only that one app session is stitched, with no network-wide access.", "ok"], ["U", "A", "Direct scan or attack on the app: nothing reachable.", "bad"]], "pro": ["No exposed ingress", "Least-privilege per app", "Works for remote users"], "con": ["Depends on broker availability", "Needs identity/PKI processes", "Planning heavy"], "app": {"c": "Zscaler, Cloudflare Access, Google BeyondCorp.", "d": "Zero-trust initiatives (DoD).", "o": "Remote healthcare, government telework."}}, {"n": "Switch & Router Security", "d": "Routers/switches are not security appliances but need hardening, plus ACLs.", "f": {"CAM": "Content Addressable Memory", "VLAN": "Virtual LAN", "MFA": "Multifactor Authentication", "ACL": "Access Control List"}, "nodes": [["R", "Rogue Device", 60, 150], ["S", "Switch", 260, 150], ["O", "Router", 460, 150], ["A", "Admin", 660, 150]], "steps": [["R", "S", "Rogue device plugs in: switch-port security shuts the port.", "bad"], ["A", "O", "Remote admin access needs MFA.", "ok"], ["O", "S", "Routing updates are authenticated for integrity.", "ok"], ["R", "S", "CAM flooding / VLAN hopping attempt: blocked by CAM protection and VLAN controls.", "bad"], ["S", "O", "Inter-device encryption prevents injection; ACLs filter.", "ok"]], "pro": ["Stops rogue devices", "Protects routing integrity", "Cheap, built in"], "con": ["Config errors are common", "Per-device effort", "Not a full firewall"], "app": {"c": "Data-centre fabrics, ISPs.", "d": "Hardened military routing.", "o": "Campuses, smart buildings."}}, {"n": "Internet of Things (IoT)", "d": "NIST: devices with hardware, software, firmware and actuators that connect and exchange data. Perimeter is blurred.", "f": {"IoT": "Internet of Things", "NIST": "National Institute of Standards and Technology", "RFID": "Radio-Frequency Identification", "TCP/IP": "Transmission Control Protocol/Internet Protocol"}, "nodes": [["T", "IoT Sensor", 60, 150], ["G", "Gateway/FW", 260, 150], ["C", "Cloud/App", 460, 150], ["X", "Botnet Attacker", 660, 150]], "steps": [["T", "G", "Sensors send data (embedded processor + comms software).", "info"], ["G", "C", "Gateway segments devices; policy limits what may connect.", "ok"], ["C", "T", "Commands and updates flow back to actuators.", "ok"], ["X", "T", "Weak default credentials: device joins a botnet (smart TVs/fridges seen in takedowns).", "bad"], ["G", "X", "Segmentation and session management contain it.", "ok"]], "pro": ["Huge automation and insight", "Anywhere/anytime connectivity", "Wide use cases"], "con": ["Weak built-in security", "25.4 bn devices by 2030 (Statista 2021 forecast)", "Unclear liability"], "app": {"c": "Smart homes, logistics, building management.", "d": "Battlefield sensors, asset tracking.", "o": "Farming, healthcare monitors, transport, toys."}}, {"n": "Firewall Rule Design & Operations", "d": "Rules must fit organisational needs, consider traffic direction and TCP state, and be revalidated, backed up and archived.", "f": {"HTTP": "Hypertext Transfer Protocol", "SYN": "Synchronize", "ACK": "Acknowledgement", "TCP": "Transmission Control Protocol"}, "nodes": [["A", "Admin", 60, 150], ["R", "Rule Set", 230, 150], ["F", "Firewall", 400, 150], ["B", "Backup/Archive", 400, 260], ["X", "Attacker", 650, 150]], "steps": [["A", "R", "Start from organisational needs and access requirements.", "info"], ["R", "F", "Weak rule 'permit any, any, port 80': outsiders can reach rogue or internal-only web servers.", "bad"], ["R", "F", "Better: 'permit <internal IP range> any eq 80' limits the source to your organisation.", "ok"], ["R", "F", "Best: also match TCP state (SYN, SYN/ACK, ACK) with a session timeout that tears down idle dynamic rules.", "ok"], ["A", "B", "Back up and archive rules so they can be restored quickly after a disaster.", "info"], ["X", "F", "Attackers probe for holes in rules, so revalidate whenever an application, service or source changes.", "bad"]], "pro": ["Least-privilege traffic control", "Recoverable configuration", "Adapts to change"], "con": ["Ongoing effort", "Mistakes open holes", "Needs monitoring"], "app": {"c": "Change-managed enterprise firewalls.", "d": "Auditable rule sets on classified networks.", "o": "Schools, hospitals, public sector."}}, {"n": "Shallow vs Deep Packet Inspection", "d": "Shallow inspection checks L2-4 headers only; DPI also reads the payload.", "f": {"OSI": "Open Systems Interconnection", "DPI": "Deep Packet Inspection", "IP": "Internet Protocol", "MAC": "Media Access Control"}, "nodes": [["P", "Packet", 60, 150], ["S", "Shallow (L2-4)", 280, 150], ["D", "DPI Engine", 500, 150], ["N", "Network", 660, 150]], "steps": [["P", "S", "Shallow inspection matches protocol (IP/UDP), IP addresses, ports and MAC addresses in headers.", "info"], ["S", "D", "Header looks legitimate, so it is passed on for payload analysis.", "info"], ["D", "N", "DPI finds clean content: forwarded.", "ok"], ["D", "P", "DPI finds malware or protocol abuse in the payload: dropped.", "bad"]], "pro": ["Shallow: cheap, found in router packet filters", "DPI: sees content"], "con":
