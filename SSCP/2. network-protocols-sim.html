const D={"cats":[["Names and directory services","DNS, LDAP"],["Network operational support and management","NTP, DHCP (and SNMP)"],["Web page operation","HTTP, HTTPS"],["Email","POP, IMAP, SMTP"],["Administrative and miscellaneous","FTP, SSH, Telnet"]],"topics":[{"id":"http","name":"HTTP / HTTPS","full":"HyperText Transfer Protocol (Secure)","meta":"OSI Layer 7 | TCP 80 / 443 | TLS for encryption","how":"Client requests a resource (IP + directory + filename); server validates authorization and returns it. HTTPS wraps the same exchange in TLS. One page load can pull hundreds of files, most kept in temporary storage.","nodes":{"c":[100,200,"Client\n(Browser)"],"d":[410,70,"DNS Server"],"s":[720,200,"Web Server"]},"modes":{"HTTP (insecure)":[["c","c","Type URL","User enters a URL; browser checks its DNS cache and HOSTS file first."],["c","d","DNS query","Browser asks DNS to resolve the FQDN to an IP address."],["d","c","IP address returned","Destination is now routable (IP + directory path + filename)."],["c","s","TCP 3-way handshake","TCP, not UDP, is used so all content arrives complete, reassembled in order."],["c","s","GET /index.html","Request names the resource and parameters, in cleartext."],["s","c","200 OK + data","Server locates file, checks authorization, replies. Sniffers can read everything."],["c","c","Render","Browser renders HTML / runs code; temp files remain on disk (reconnaissance target)."]],"HTTPS (TLS)":[["c","c","Type URL","User enters a URL; browser checks its DNS cache and HOSTS file first."],["c","d","DNS query","Browser asks DNS to resolve the FQDN to an IP address."],["d","c","IP address returned","Destination is now routable (IP + directory path + filename)."],["c","s","TCP 3-way handshake","TCP, not UDP, is used so all content arrives complete, reassembled in order."],["c","s","ClientHello","Client lists supported TLS versions and cipher suites."],["s","c","ServerHello + Certificate","Server proves its identity with a certificate."],["c","s","Key exchange","Both sides derive a shared session key."],["c","s","Encrypted GET","Request is encrypted."],["s","c","Encrypted 200 OK","Only ciphertext is visible on the wire."],["c","c","Render","Browser renders; cleanup policy for temp files still matters."]]},"pros":["Universal, works through any browser","Stateless and simple; easy to scale with caches/CDNs","HTTPS gives confidentiality, integrity and server authentication","TCP guarantees complete, ordered delivery"],"cons":["Plain HTTP is readable and modifiable in transit","TLS certificates must be managed and renewed","Browser temp files are a recon target","Needs browser configuration and use policies"],"apps":{"Commercial":"E-commerce, online banking, SaaS portals, payment gateways (HTTPS).","Defense":"Secure intranet portals, logistics and C2 dashboards over TLS, mission web apps.","Other":"E-government, telemedicine, e-learning, REST APIs, IoT dashboards."},"sec":"Prefer HTTPS everywhere; set browser policies (clear temp content on exit, block untrusted add-ons) to protect the security posture.","extra":[{"t":"Hypertext background","p":"Hyperlinked information dates to the 1960s. Early single-machine systems (e.g. HyperCard, 1987) treated a link target as a separate file and relied on the host OS to find and open it. HTTP does this across a network: the request must resolve to a destination IP, a directory branch and a filename, plus optional parameters."},{"t":"Request handling and policy","p":"The server locates the resource, validates the requester is authorized, then transfers it; the browser renders HTML or executes code. TCP (not UDP) is required for complete, ordered delivery. One URL can pull hundreds or thousands of files, mostly used once but often left in temp storage, so organizations need browser configuration and use policies."}]},{"id":"dhcp","name":"DHCP / DHCPv6 - Obtaining an IP address","full":"Dynamic Host Configuration Protocol","meta":"OSI Layer 7 | UDP 67 (server) / 68 (client) | RFC 2131, RFC 3927 (APIPA)","how":"Replaces manual static addressing (and older RARP / BOOTP). A DHCP server leases addresses from a pool; if no server answers, the client self-assigns 169.254.x.x (APIPA). DHCPv6 does the same for IPv6.","nodes":{"c":[110,200,"Client\n(new host)"],"s":[710,200,"DHCP Server\n(address pool)"]},"modes":{"Normal lease (DORA)":[["c","s","DHCPDiscover","Client broadcasts on UDP 67: any DHCP server out there?"],["s","c","DHCPOffer (address)","Server offers an address from its pre-configured pool, plus mask, gateway, DNS, lease time."],["c","s","DHCPRequest (accept)","Client formally accepts the offered address."],["s","c","DHCPAck (confirmation)","Server confirms the lease; client configures its interface."],["c","c","ARP + ready","Client uses ARP to learn the gateway MAC, then can communicate across the Layer 3 boundary."]],"No server: APIPA":[["c","s","DHCPDiscover","Broadcast on UDP 67."],["c","c","Timeout","No DHCP server answers within the predetermined time."],["c","s","DHCPDiscover (retry)","Client retries."],["c","c","APIPA 169.254.x.x","Client self-assigns an IPv4 link-local address (RFC 3927)."],["c","c","Local only","Works on the local segment only; no gateway, so no routing beyond Layer 3 boundary."]],"DHCPv6 (IPv6)":[["c","s","Solicit","IPv6 client multicasts to find DHCPv6 servers."],["s","c","Advertise","Server offers an IPv6 address from its pool."],["c","s","Request","Client asks for the offered address."],["s","c","Reply","Server confirms the lease (similar tool to DHCP for IPv4)."]]},"pros":["Centralized, automatic administration","Handles host mobility and large networks","Reduces address conflicts and typing errors","Also delivers gateway, DNS, lease time"],"cons":["Server is a single point of failure without redundancy","Unauthenticated: rogue DHCP servers and address-pool exhaustion attacks","Broadcast based, limited to the segment unless relays are used"],"apps":{"Commercial":"Enterprise campuses, retail Wi-Fi, ISP home routers, data centers.","Defense":"Base LANs, deployable/tactical field networks that must self-configure quickly (with DHCP snooping).","Other":"University Wi-Fi, hospitals, smart buildings, guest networks."},"sec":"Use DHCP snooping, authorized-server lists and port security; monitor pool usage.","extra":[{"t":"Why DHCP","p":"Static address configs had to be built and maintained so clients could communicate across the Layer 3 boundary. Host growth and mobility made centralized administration the answer. Earlier tools RARP and BOOTP still needed per-host information and were hard to run at scale."},{"t":"Rules","p":"RFC 2131: client broadcasts DHCP Discover on UDP 67; server replies on UDP 68 from a configured address zone. No reply in the predetermined time: self-assign 169.254.x.x (APIPA, RFC 3927). DHCPv6 serves IPv6."}]},{"id":"dns","name":"DNS - Name Resolution & Security","full":"Domain Name System","meta":"OSI Layer 7 | UDP/TCP 53 | DNSSEC (IETF)","how":"Hierarchical naming: root \".\" > TLD (.com .org .gov) > second-level (wikipedia) > subdomains (en., es.). FQDNs resolve to IPs by cache > HOSTS > local DNS > referrals until the authoritative server answers. Original DNS had no authentication, nonrepudiation or integrity; DNSSEC adds them via signatures and a chain of trust.","nodes":{"c":[90,310,"Client\n(cache, HOSTS)"],"l":[330,310,"Local DNS\nResolver"],"r":[250,70,"Root \".\""],"t":[500,70,"TLD\n(.org)"],"a":[730,190,"Authoritative\nwikipedia.org"],"x":[560,320,"Attacker"]},"modes":{"Recursive lookup":[["c","c","Check cache + HOSTS","Client checks local DNS cache, then HOSTS file."],["c","l","Query: en.wikipedia.org?","Not found locally, so ask the local DNS server."],["l","r","Who handles .org?","Local DNS asks a root server (the \".\" at the end of an FQDN)."],["r","l","Referral to .org TLD","Root manages top-level domains; points to the .org TLD server."],["l","t","Who handles wikipedia.org?","Asks the TLD server for the second-level domain."],["t","l","Referral to authoritative","TLD points to the zone that owns the record."],["l","a","IP of en.wikipedia.org?","Authoritative server holds the real record."],["a","l","A record","Authoritative answer returned."],["l","c","IP address (cached)","Resolver caches it and answers the client."]],"DNSSEC validated":[["c","c","Check cache + HOSTS","Client checks local DNS cache, then HOSTS file."],["c","l","Query: en.wikipedia.org?","Not found locally, so ask the local DNS server."],["l","r","Who handles .org?","Local DNS asks a root server (the \".\" at the end of an FQDN)."],["r","l","Referral to .org TLD","Root manages top-level domains; points to the .org TLD server."],["l","t","Who handles wikipedia.org?","Asks the TLD server for the second-level domain."],["t","l","Referral to authoritative","TLD points to the zone that owns the record."],["l","a","IP of en.wikipedia.org?","Authoritative server holds the real record."],["a","l","A record + RRSIG","Answer carries a digital signature."],["l","l","Validate chain of trust","Resolver verifies signatures from trust anchor > root > TLD > zone."],["l","c","Validated IP","Only authentic data is cached and returned."]],"Cache poisoning (no DNSSEC)":[["c","c","Check cache + HOSTS","Client checks local DNS cache, then HOSTS file."],["c","l","Query: en.wikipedia.org?","Not found locally, so ask the local DNS server."],["l","r","Who handles .org?","Local DNS asks a root server (the \".\" at the end of an FQDN)."],["r","l","Referral to .org TLD","Root manages top-level domains; points to the .org TLD server."],["l","t","Who handles wikipedia.org?","Asks the TLD server for the second-level domain."],["t","l","Referral to authoritative","TLD points to the zone that owns the record."],["l","a","IP of en.wikipedia.org?","Authoritative server holds the real record."],["x","l","Forged reply","Attacker races a fake answer; plain DNS cannot authenticate it."],["l","l","Cache poisoned","Resolver stores the false record."],["l","c","Wrong IP","User is sent to the attacker site."]],"Answered from cache":[["c","c","Cache / HOSTS hit?","Client checks local DNS cache and HOSTS file: miss."],["c","l","Query","Asks the local DNS server."],["l","l","Found in cache","Local DNS already has the record."],["l","c","IP address","Answer returned without contacting root/TLD/authoritative."]]},"pros":["Human-friendly names instead of 12-digit IPv4 numbers","Hierarchical, distributed, scales to billions of names","Caching makes lookups fast","DNSSEC adds authenticity and integrity"],"cons":["Original design has no authentication or integrity","Cache poisoning, spoofing and amplification attacks","DNSSEC adds key management complexity and larger responses","Directory of zones is valuable reconnaissance"],"apps":{"Commercial":"Every website, email routing, CDNs and cloud load balancing.","Defense":"Private/split-horizon DNS on internal networks; signed zones for government domains.","Other":"ISPs, service discovery, anti-phishing (protective DNS)."},"sec":"Deploy DNSSEC, restrict zone transfers, use randomized ports/IDs, patch resolvers, monitor for abnormal queries.","extra":[{"t":"Why DNS exists","p":"People struggle to remember more than about seven digits, IPv4 addresses are up to 12 digits, and ARPANET reached hundreds of hosts in the mid-1980s. Mockapetris, Postel and Su proposed hierarchical names mapped to IPs."},{"t":"Domain name space","tree":[["Root \".\"",[[".com",[["google"]]],[".net"],[".gov"],[".uk"],[".ru"],[".org",[["wikipedia",[["en.wikipedia.org"],["es.wikipedia.org (Spanish users go to a different server)"]]],["isc2"]]]]]]},{"t":"Levels of a name","h":["Level","Example","Note"],"r":[["Root",".","Administrative dot at end of an FQDN"],["TLD",".com .edu .gov .org","500+ TLDs exist"],["Second-level","isc2.org","Company names"],["Third/fourth","www.isc2.org, docs.microsoft.com, translate.google.com","Product or service; \"www\" = web page; each level resolves to a unique IP"]]},{"t":"Lookup order and security","p":"Local DNS cache, then HOSTS.TXT, then local DNS server, then referrals to more authoritative servers. Original DNS had no authentication, nonrepudiation or integrity for zone transfers; IETF DNSSEC automates trust-anchor validation of the DNS systems in a resolver hierarchy."}]},{"id":"snmp","name":"SNMP","full":"Simple Network Management Protocol","meta":"OSI Layer 7 | UDP 161 / 162 | v1, v2c, v3","how":"A manager (NMS) polls agents on routers, switches and servers to GET or SET variables defined in a MIB; agents also push TRAPs when conditions occur (e.g. overheating). v1/v2 authenticate only with a cleartext community string; v3 adds authentication and encryption.","nodes":{"m":[410,70,"Manager (NMS)\n+ MIB"],"r":[110,300,"Router\nAgent"],"s":[410,310,"Switch\nAgent"],"h":[710,300,"Server\nAgent"],"x":[710,70,"Attacker"]},"modes":{"Get / Set (v1, v2c)":[["m","r","GetRequest + community","Manager asks for a MIB variable; community string sent in cleartext."],["r","m","GetResponse","Agent returns routing stats / performance values."],["m","s","SetRequest","Manager changes a variable (a configuration action)."],["s","m","Response","Agent confirms. Sniffed strings could be replayed to fake commands."]],"Trap alert":[["h","h","Threshold exceeded","System running too hot (maintenance issue or overload)."],["h","m","TRAP","Agent sends an unsolicited alert."],["m","m","ALERT!","Operator reacts; different causes need different actions."]],"SNMPv3 secure":[["m","r","Request (authPriv)","User-based authentication plus encryption."],["r","r","Verify + decrypt","Agent checks user and integrity."],["r","m","Encrypted response","Community string no longer exposed."]],"Community-string brute force":[["x","r","Guess \"public\", \"private\"...","Attacker tries default or guessable community strings."],["r","x","Reply on match","A default string is accepted: access granted."],["x","r","SetRequest","Attacker reads or changes device configuration. Mitigation: SNMPv3, strong strings, ACLs."]]},"pros":["Vendor-neutral standard for monitoring","Light weight; scales to thousands of devices","Traps give near real-time alerts","v3 adds strong security"],"cons":["Default/guessable community strings enable brute force","v1/v2 have no encryption","Management tools hold high privilege (cf. 2020 SolarWinds attack)","MIB differs per device"],"apps":{"Commercial":"Data centers, ISPs and telecom carriers monitoring routers, base stations, UPS (Zabbix, Nagios, SolarWinds).","Defense":"Network operations centers supervising tactical and base networks (SNMPv3 only).","Other":"Smart grid, industrial plants, campus networks, hospitals."},"sec":"Use SNMPv3, change defaults, restrict managers by ACL, segregate the management network, limit tool privilege.","extra":[{"t":"Components","h":["Component","Role"],"r":[["Network management system","Manager that polls agents and receives traps"],["Management information base","Device-specific variables (routing table stats, performance, temperature)"],["Managed devices","Routers, switches, servers"],["Agents","Software on the device: answers get/set, sends traps"]]},{"t":"Versions","h":["Version","Security"],"r":[["v1","Community string only, cleartext"],["v2","Still cleartext community string"],["v3","Encrypts and authenticates"]]},{"t":"Risk","p":"Easiest exploit: brute force of default or guessable community strings. In 2020 SolarWinds was attacked partly because management tools hold high privilege across the infrastructure."}]},{"id":"ldap","name":"LDAP","full":"Lightweight Directory Access Protocol","meta":"OSI Layer 7 | TCP 389 (clear) / 636 (TLS) | evolved from X.500","how":"Directory entries live in a hierarchical tree. Each entry has a Distinguished Name (DN) built from RDN, CN, OU, DC parts, plus name/value attributes. Clients bind, search and read entries; v3 adds TLS.","nodes":{"c":[110,200,"Client / App\n(login, email)"],"s":[710,200,"LDAP Server\n(directory tree)"]},"modes":{"LDAP (TCP 389)":[["c","s","Bind (login)","Client authenticates to the directory."],["s","c","Bind success","Credentials accepted."],["c","s","Search cn=Julie Smith","Query with base DN dc=ISC2,dc=org."],["s","s","Walk the tree","Server walks dc=org > dc=ISC2 > dc=US > ou=People."],["s","c","Entry + attributes","Returns DN cn=Julie Smith,ou=People,dc=US,dc=ISC2,dc=org with its name/value pairs."],["c","s","Unbind","Session closed."]],"LDAPS / TLS (TCP 636)":[["c","s","TLS ClientHello","Encrypted session set up before any credentials move."],["s","c","Certificate","Server identity proven."],["c","s","Bind (login) (encrypted)","Client authenticates to the directory."],["s","c","Bind success (encrypted)","Credentials accepted."],["c","s","Search cn=Julie Smith (encrypted)","Query with base DN dc=ISC2,dc=org."],["s","s","Walk the tree","Server walks dc=org > dc=ISC2 > dc=US > ou=People."],["s","c","Entry + attributes (encrypted)","Returns DN cn=Julie Smith,ou=People,dc=US,dc=ISC2,dc=org with its name/value pairs."],["c","s","Unbind (encrypted)","Session closed."]]},"pros":["Fast reads of structured identity data","Single source for users, devices, services","Central to SSO and access control (Active Directory, OpenLDAP)","Standard, interoperable"],"cons":["Prime attack target, tightly tied to IAM","Port 389 is unencrypted by default","Anonymous binds / loose ACLs leak information","Directory design needs care"],"apps":{"Commercial":"Corporate logins via Active Directory, email address books, VPN/Wi-Fi authentication.","Defense":"PKI/smart-card identity directories and role-based access.","Other":"University SSO, hospital staff directories, government identity services."},"sec":"Use TLS (636/StartTLS), disable anonymous bind, apply least-privilege ACLs, monitor queries.","extra":[{"t":"Directory tree","tree":[["dc=ISC2, dc=org",[["dc=US, dc=ISC2, dc=org",[["ou=Education"],["ou=People",[["cn=Julie Smith"]]]]]]]]},{"t":"Attributes","h":["Attribute","Meaning","Example"],"r":[["DN","Unique identifier in hierarchy","cn=Julie Smith, ou=People, dc=US, dc=ISC2, dc=org"],["RDN","First component of the DN","cn=Julie Smith"],["CN","Preferred entry name","cn=Joe Smith"],["DC","One component of a domain","dc=ISC2"],["OU","Container holding other entries","ou=People"]]},{"t":"Background","p":"Like DNS, directories publish structured info on users, services, devices and apps, and tie into IAM, so they are prime targets. LDAP evolved from X.500; DNs are typically based on the DNS name. Clear on TCP 389; v3 uses TLS on TCP 636."}]},{"id":"arp","name":"ARP - IP to MAC","full":"Address Resolution Protocol","meta":"Layer 2/3 boundary | IPv4 | MAC = 48 bits (24 vendor + 24 unique)","how":"A NIC has a fixed MAC but its IP changes per network, so final delivery needs an IP-to-MAC map. Host broadcasts \"Who has IP? Tell me\"; owner replies with its MAC; requester stores it in its ARP cache (view with arp -a). MACs can be duplicated or changed by software or EEPROM programming.","nodes":{"a":[100,200,"Host A\n192.168.0.1"],"w":[410,190,"Switch"],"b":[720,200,"Host B\n192.168.0.5"],"x":[410,330,"Attacker"],"y":[410,330,"Host C\n(same MAC)"]},"modes":{"Normal resolution":[["a","a","Cache miss","Host A needs the MAC for 192.168.0.5; \"arp -a\" shows no entry."],["a","w","ARP Request (broadcast)","\"Who has 192.168.0.5? Tell 192.168.0.1\" sent to FF-FF-FF-FF-FF-FF."],["w","b","Flooded to all ports","Every host on the segment receives the question; only the owner answers."],["b","a","ARP Reply (unicast)","\"192.168.0.5 is at MAC xx-xx-...\" returned."],["a","a","Cache entry","Stored as dynamic in the ARP cache."],["a","b","Data frame","Frame addressed to the MAC is delivered."]],"ARP spoofing":[["a","a","Cache miss","Host A needs the MAC for 192.168.0.5; \"arp -a\" shows no entry."],["a","w","ARP Request (broadcast)","\"Who has 192.168.0.5? Tell 192.168.0.1\" sent to FF-FF-FF-FF-FF-FF."],["w","b","Flooded to all ports","Every host on the segment receives the question; only the owner answers."],["x","a","Forged ARP reply","Attacker claims the victim IP with its own MAC; ARP has no authentication."],["a","a","Cache poisoned","Entry overwritten."],["a","x","Traffic redirected","Man-in-the-middle position gained."],["x","b","Forwarded","Attacker relays to stay unnoticed."]],"Duplicate / changed MAC":[["y","y","MAC changed","MAC altered by software, network settings or an EEPROM programmer."],["a","w","Frame to MAC AA-BB-CC-11-22-33","Host A addresses the frame to Host B MAC."],["w","b","Delivered to Host B","Intended recipient."],["w","y","Also delivered to Host C","Duplicate MAC on the same segment causes conflict (harmless on different segments)."]]},"pros":["Automatic, zero-configuration","Simple and fast on a LAN","Cache reduces broadcasts"],"cons":["No authentication, so spoofing and MITM","Broadcast traffic","IPv4 only (IPv6 uses Neighbor Discovery)","Duplicate or changed MACs cause conflicts"],"apps":{"Commercial":"Every IPv4 Ethernet/Wi-Fi LAN in offices, data centers, retail.","Defense":"Secure LANs hardened with Dynamic ARP Inspection, static entries, port security.","Other":"Industrial/SCADA networks, campuses, home networks."},"sec":"Enable Dynamic ARP Inspection, port security, static entries for critical hosts, watch for duplicate MACs.","extra":[{"t":"Why ARP","p":"A NIC has a fixed MAC but its IP changes from network to network, so final delivery must use the static MAC. The switch keeps an IP-to-MAC cross-reference built with ARP (\"ARPing\"); a sniffer shows \"Who has 192.168.0.5? Tell 192.168.0.1\"."},{"t":"MAC address anatomy (48 bits)","h":["Part","Bits","Meaning"],"r":[["First half","24","Assigned to the hardware manufacturer"],["Second half","24","Unique value for the card"]]},{"t":"Reality check","p":"In theory MACs are unique and fixed; in practice duplicates occur (a problem only on the same segment) and they can be changed with an EEPROM programmer or in software."},{"t":"arp -a (ARP cache)","h":["Internet Address","Physical Address","Type"],"r":[["10.103.139.65","00-ff-14-1b-ac-ea","dynamic"],["10.103.139.67","ff-ff-ff-ff-ff-ff","static"],["224.0.0.22","01-00-5e-00-00-16","static"],["224.0.0.251","01-00-5e-00-00-fb","static"],["224.0.0.252","01-00-5e-00-00-fc","static"],["239.255.255.250","01-00-5e-7f-ff-fa","static"],["255.255.255.255","ff-ff-ff-ff-ff-ff","static"]]}]},{"id":"arch","name":"Network Architectures","full":"Segments, Intranet, Extranet, LAN/MAN/WAN/PAN, DMZ, Bastion","meta":"Routers join segments; firewalls separate security zones","how":"Segment = IP interconnected hosts joined by a router. Intranet = internal, org-controlled. Extranet = connects many intranets (often via VPN). LAN < MAN < WAN by area. PAN = one person devices (Bluetooth/NFC). DMZ = buffer zone between public servers and internal network, sometimes with a hardened bastion (jump) server.","nodes":{},"nm":{"PAN to Internet":{"w":[80,300,"Smart watch"],"p":[250,300,"Phone\n(gateway)"],"r":[430,180,"Wi-Fi Router\n(ISP on-ramp)"],"i":[720,180,"Internet"]},"DMZ + bastion":{"u":[80,190,"Internet user"],"f":[240,190,"Firewall 1"],"d":[410,70,"DMZ: web,\nmail servers"],"b":[410,310,"Bastion\n(jump) host"],"g":[580,190,"Firewall 2"],"l":[740,190,"Intranet\n(DB, users)"]},"Extranet via VPN":{"a":[80,190,"Company A\nIntranet"],"ga":[250,190,"VPN gateway A"],"i":[410,70,"Internet"],"gb":[570,190,"VPN gateway B"],"b":[740,190,"Company B\nIntranet"]},"LAN - MAN - WAN":{"a":[80,100,"LAN: Building 1"],"b":[80,300,"LAN: Building 2"],"m":[330,200,"MAN\n(city fibre)"],"w":[570,200,"WAN\n(leased / satellite)"],"r":[740,200,"Remote site\nLAN"]},"Segments & intranet":{"a":[80,300,"Host\n(Segment A)"],"b":[80,80,"Host\n(Segment B)"],"r":[340,190,"Router"],"i":[650,190,"Internet"]}},"modes":{"PAN to Internet":[["w","p","Bluetooth / NFC","Wearable talks to the phone on the PAN."],["p","r","Wi-Fi / mobile data","Phone is the gateway to the internet."],["r","i","ISP point-to-point link","On-ramp provided by the ISP const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms));
let ti=0,mi=0,idx=-1,play=false,busy=false,spd=1,tok=0;
const T=()=>D.topics[ti],MN=()=>Object.keys(T().modes),ST=()=>T().modes[MN()[mi]],ND=()=>(T().nm&&T().nm[MN()[mi]])||T().nodes;
function tabs(){$('#tabs').innerHTML=D.topics.map((t,i)=>`<button class="${i==ti?'on':''}" onclick="pick(${i})">${t.name.split(' - ')[0].split(' / ')[0]}</button>`).join('')+`<button class="${ti<0?'on':''}" onclick="pick(-1)">Glossary</button>`}
function pick(i){tok++;ti=i;mi=0;idx=-1;play=false;busy=false;tabs();ti<0?gloss():render()}
function lst(a){return '<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function render(){const t=T();$('#main').innerHTML=`<div class="card"><h2>${t.name}</h2><div><b>${t.full}</b> <span class="mu">| ${t.meta}</span></div><p>${t.how}</p>
<div class="row" id="modes">${MN().map((m,i)=>`<button class="${i==mi?'on':''}" onclick="mode(${i})">${m}</button>`).join('')}</div>
<div class="row"><button id="pp" onclick="pp()">Play</button><button onclick="step()">Step</button><button onclick="rst()">Reset</button><label class="mu">Speed <select onchange="spd=+this.value"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label></div>
<svg id="sv" viewBox="0 0 820 380"></svg><div id="desc" class="mu" style="min-height:44px">Press Play or Step.</div></div>
${exh(t)}<div class="card"><h2>Working principle, step by step</h2><ol id="sl"></ol></div>
<div class="g"><div class="card"><h2 class="pro">Pros</h2>${lst(t.pros)}</div><div class="card"><h2 class="con">Cons</h2>${lst(t.cons)}</div></div>
<div class="card"><h2>Where it is deployed</h2><div class="g">${Object.entries(t.apps).map(([k,v])=>`<div><b>${k}</b><br>${v}</div>`).join('')}</div></div>
<div class="card"><h2>Security considerations</h2>${t.sec}</div>`;draw()}
function tr(n){return '<li>'+n[0]+(n[1]?'<ul class="tree">'+n[1].map(tr).join('')+'</ul>':'')+'</li>'}
function exh(t){if(!t.extra)return '';return '<div class="card"><h2>Key concepts</h2><div class="g">'+t.extra.map(e=>'<div><b>'+e.t+'</b>'+(e.p?'<p style="margin:4px 0">'+e.p+'</p>':e.tree?'<ul class="tree">'+e.tree.map(tr).join('')+'</ul>':'<div class="wrap"><table><tr>'+e.h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+e.r.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>')+'</div>').join('')+'</div></div>'}
function mode(i){tok++;mi=i;idx=-1;play=false;busy=false;document.querySelectorAll('#modes button').forEach((b,j)=>b.className=j==i?'on':'');draw()}
function draw(){const n=ND(),S=ST(),u=[...new Set(S.flatMap(s=>[s[0],s[1]]))],seen={};let h='';
S.forEach(s=>{if(s[0]!=s[1]){const k=[s[0],s[1]].sort().join();if(!seen[k]){seen[k]=1;const a=n[s[0]],b=n[s[1]];h+=`<line class="ln" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`}}});
u.forEach(id=>{const[x,y,l]=n[id],L=l.split('\n');h+=`<g class="nd"><rect x="${x-70}" y="${y-26}" width="140" height="52" rx="10"/>`+L.map((q,i)=>`<text x="${x}" y="${y+4+(i-(L.length-1)/2)*16}">${q}</text>`).join('')+'</g>'});
h+=`<g id="pk" style="display:none"><circle r="10" fill="var(--pk)"/></g><text id="cap" x="410" y="368"></text>`;$('#sv').innerHTML=h;
$('#sl').innerHTML=S.map((s,i)=>`<li id="s${i}"><b>${i+1}. ${s[2]}</b>${s[3]}</li>`).join('');$('#desc').textContent='Press Play or Step.';$('#pp').textContent='Play'}
function mark(){ST().forEach((s,i)=>{const e=$('#s'+i);e.className=i<idx?'done':i==idx?'act done':''});const s=ST()[idx];$('#desc').innerHTML='<b>'+(idx+1)+'. '+s[2]+'</b> - '+s[3]}
function go(i){return new Promise(res=>{busy=true;const s=ST()[i],n=ND(),a=n[s[0]],b=n[s[1]],pk=$('#pk'),me=tok,self=s[0]==s[1],d=(self?900:1200)/spd,t0=performance.now();$('#cap').textContent=s[2];pk.style.display='';
(function f(t){if(me!=tok){busy=false;return res(false)}const p=Math.min(1,(t-t0)/d);
pk.setAttribute('transform',self?`translate(${a[0]},${a[1]-40}) scale(${1+1.2*Math.sin(p*Math.PI)})`:`translate(${a[0]+(b[0]-a[0])*p},${a[1]+(b[1]-a[1])*p})`);
if(p<1)requestAnimationFrame(f);else{idx=i;busy=false;mark();res(true)}})(t0)})}
async function pp(){if(play){play=false;$('#pp').textContent='Play';return}if(busy)return;if(idx>=ST().length-1){idx=-1;draw()}play=true;$('#pp').textContent='Pause';const me=tok;
while(play&&me==tok&&idx<ST().length-1){if(!await go(idx+1))return;await sl(350/spd)}if(me==tok){play=false;$('#pp').textContent='Play'}}
function step(){if(play||busy)return;if(idx>=ST().length-1){idx=-1;draw()}go(idx+1)}
function rst(){tok++;idx=-1;play=false;busy=false;draw()}
function gloss(){let r='';for(let i=0;i<D.gl.length;i+=3)r+=`<tr><td><b>${D.gl[i]}</b></td><td>${D.gl[i+1]}</td><td>${D.gl[i+2]}</td></tr>`;
$('#main').innerHTML=`<div class="card"><h2>OSI Layer 7 protocol categories</h2>${lst(D.cats.map(c=>`<b>${c[0]}</b>: ${c[1]}`))}</div><div class="card"><h2>Terminology: full forms</h2><input placeholder="Search..." oninput="fl(this.value)"><div class="wrap"><table id="gt"><tr><th>Term</th><th>Full form</th><th>Meaning</th></tr>${r}</table></div></div>`}
function fl(q){q=q.toLowerCase();document.querySelectorAll('#gt tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?'':'none'})}

</script></body></html>
