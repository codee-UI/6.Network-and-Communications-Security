pos.forEach((p,i)=>{const act=s&&(s[0]==i||s[1]==i),atk=/ttack|Sniff/.test(x.n[i]);const col=atk?'var(--bad)':'var(--ac)';
h+=`<circle cx="${p[0]}" cy="${p[1]}" r="${act?36:30}" fill="${col}" opacity="${act?1:.55}"/><text x="${p[0]}" y="${p[1]+52}" text-anchor="middle" fill="var(--fg)" font-size="13" font-weight="600">${x.n[i]}</text><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${i==2&&atk?'☠':'●'}</text>`});

if(s[0]==s[1])h+=`<circle cx="${f[0]}" cy="${f[1]}" r="${44+(a||0)*20}" fill="none" stroke="${c}" stroke-width="3" opacity="${1-(a||0)}"/>`;

function go(i){step=i;const s=D[cur].s[i];$('cap').textContent=s[2];$('cap').className=s[3]?'bad':'';
[...$('ol').children].forEach((l,j)=>l.classList.toggle('on',j==i));const t0=performance.now();
(function f(n){const a=Math.min(1,(n-t0)/900);draw(a);if(a<1&&step==i)requestAnimationFrame(f)})(t0)}
function play(){if(timer){stop();return}$('pl').textContent='Pause';const n=D[cur].s.length;if(step>=n-1)step=-1;
