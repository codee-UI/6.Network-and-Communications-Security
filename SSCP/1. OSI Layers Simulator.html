{t:'Stack overview',h:'OSI model: encapsulation down, de-encapsulation up',sc:{k:'stk'},

how:['The user data enters at Layer 7 through a program such as a browser.','Layers 6 and 5 format, encrypt and set up the session.','Layer 4 adds a TCP/UDP header (ports): a segment.','Layer 3 adds an IP header (logical addresses): a packet.','Layer 2 adds a MAC header and trailer: a frame.','Layer 1 turns the frame into bits on the medium. The receiver reverses every step.','NIST defines a packet as the logical unit of network communications produced by the transport layer, and transmission as information being electronically sent from one place to others.'],

app:'Commercial: every enterprise LAN, ISP and cloud data centre. Defence: tactical networks mixing radio, satellite and fibre under one IP layer. Other: hospitals, railways, industrial control.',

{t:'L1 Physical',h:'Layer 1: Physical, bits on the medium',sc:LAD(['Host A','Repeater','Host B'],[[0,0,'Frame to bits','Layer 2 hands a frame down. Layer 1 converts it to a stream of ones and zeros suited to the medium (copper, fibre, radio).'],[0,1,'Weak signal 1010','The signal weakens (attenuation) and picks up noise as it travels.'],[1,1,'Regenerate bits','A repeater regenerates the received bits cleanly. An amplifier only boosts energy and may boost errors too.'],[1,2,'Clean signal 1010','The regenerated signal travels further down the medium.'],[2,2,'Bits to frame','Bits are reassembled into bytes, put into a frame, the header is stripped and the frame goes up to Layer 2.']]),

how:['Ethernet uses bus (logical) over star or point-to-point (physical) topologies.','Before sending, a device listens (carrier sense). If two send at once, a collision is detected and both retry (CSMA/CD).','Full-duplex Ethernet has no collisions.','Media: coaxial, twisted pair, fibre, radio. Speeds from 10 Mbps up to 1 Gbps (1000BASE-T/SX/LX).','InfiniBand adds flow control and virtual lanes for predictable performance (up to 800 Gb/s).'],
pro:['Simple, cheap, fast media','Fibre is immune to electrical interference','Full-duplex removes collisions'],con:['Repeaters and hubs are obsolete','Attenuation and interference','Wiring and radio can be tapped physically'],
app:'Commercial: Cat6 and fibre in offices, InfiniBand in AI/HPC data centres. Defence: shielded or fibre cabling, RF surveillance of Wi-Fi space. Other: factories, hospitals, supercomputing labs.',

{t:'L2 Data Link',h:'Layer 2: Data Link, frames and MAC addresses',sc:LAD(['Host A','Switch','Host B'],[[0,1,'ARP: who has IP B?','A knows B\u2019s IP but needs its MAC, so it broadcasts an ARP request.'],[1,2,'Flooded to all ports','The switch learns A\u2019s MAC and floods the broadcast.'],[2,1,'ARP reply: my MAC','B replies directly (unicast) with its MAC.'],[1,0,'Reply forwarded','The switch learns B\u2019s port and forwards the reply.'],[0,1,'Frame to MAC B','A builds a frame: destination MAC, source MAC, payload, check value (FCS).'],[1,2,'Forward to B only','The switch looks up its MAC table and sends the frame out of one port.']]),

{t:'L3 Network',h:'Layer 3: Network, IP addressing and routing',sc:LAD(['Host A','Router','Host B'],[[0,1,'ICMP Echo (ping)','Host A sends an IP packet to B\u2019s address, TTL 64. The destination is on another network, so it goes to the router.'],[1,1,'Route lookup, TTL-1','The router reads the IP destination, consults its routing table and picks the next hop. TTL drops by one.'],[1,2,'Forward packet','The packet is forwarded. Segments too long are split into packets.'],[2,1,'Echo reply','B answers with an ICMP Echo Reply.'],[1,0,'Reply forwarded','A displays the round-trip time. Traceroute uses rising TTL values the same way.']]),

pro:['Connects disparate networks','Scales globally','IPv6 gives a huge address space'],con:['Misconfigured or unpatched routers','Reveals network fingerprint','Routing lookups cost CPU time'],
app:'Commercial: ISPs, branch-to-HQ WANs. Defence: segmented secure enclaves and gateways. Other: smart grids, airline reservation networks.',

{t:'Transmission modes',h:'Layer 3 transmission methods: unicast, broadcast, multicast, anycast, geocast',

how:['Unicast: sender to one host.','Broadcast: sender to all hosts on the segment (ARP request).','Multicast: sender to a joined group.','Anycast: sender to the closest member of a group.','Geocast: sender to hosts in a defined region.','The simulator highlights which hosts receive each mode.'],
pro:['Unicast: private','Multicast: bandwidth efficient','Anycast: fast, resilient service','Geocast: reduces unnecessary traffic'],con:['Unicast: no redundancy','Broadcast: noisy, DoS risk','Multicast: eavesdropping, abuse','Anycast: extra servers and routing cost'],
app:'Commercial: CDNs and public DNS (anycast), IPTV and stock-ticker feeds (multicast). Defence: regional alerts and tactical group messaging (geocast, multicast). Other: emergency alert systems, software updates.',thr:'Broadcast floods, multicast abuse.',def:'Broadcast limits, VLANs, IGMP snooping, rate limiting.'},
{t:'Routing',h:'Routers and routing protocols: RIP, OSPF, BGP, MPLS',

how:['Static routes work for tiny networks. Larger ones use dynamic protocols.','Interior protocols (RIP, EIGRP, OSPF, IS-IS) run inside an AS. Exterior (BGP) runs between ASes.','Distance vector (RIP) counts hops. Link-state (OSPF, IS-IS) floods LSAs and each router runs shortest-path-first.','Path vector (BGP) keeps loop-free AS paths.','MPLS (32-bit header: 20-bit label, 3-bit class of service, 1-bit stack, 8-bit TTL) labels paths once, then forwards by label.'],

f:'TCP=Transmission Control Protocol;UDP=User Datagram Protocol;SYN=Synchronize;ACK=Acknowledge;FIN=Finish;IANA=Internet Assigned Numbers Authority;HTTP(S)=Hypertext Transfer Protocol (Secure);DNS=Domain Name Service;SMTP=Simple Mail Transfer Protocol;SSH=Secure Shell;FTP=File Transfer Protocol;TFTP=Trivial FTP;SNMP=Simple Network Management Protocol;BGP=Border Gateway Protocol;RADIUS=Remote Authentication Dial-In User Service',
