<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Network Concepts Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f7;--card:#fff;--ink:#12242b;--mute:#5b6e76;--ln:#cfdadd;--ac:#0a7d8c;--hot:#c92a5b;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--card:#14262d;--ink:#e6f0f2;--mute:#8fa5ad;--ln:#264049;--ac:#3cc4d6;--hot:#ff6b95;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1f;--card:#14262d;--ink:#e6f0f2;--mute:#8fa5ad;--ln:#264049;--ac:#3cc4d6;--hot:#ff6b95;--ok:#69db7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln)}
header h1{font-size:1.2rem;margin:0;flex:1}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:18px;max-width:1300px;margin:auto}
nav{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto}
nav h3{margin:12px 0 2px;font-size:.9rem;color:var(--mute);font-weight:600}
nav button{text-align:left;border-color:transparent;background:none}nav button[aria-current=true]{background:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:1.5rem}p{margin:.3em 0}.mute{color:var(--mute)}
canvas{width:100%;display:block;background:var(--bg);border:1px solid var(--ln);border-radius:10px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#cap{font-size:1.05rem;min-height:3.2em;border-left:4px solid var(--ac);padding-left:12px}
ol{padding-left:0;list-style:none;margin:0;counter-reset:s}
ol li{counter-increment:s;padding:8px 10px 8px 38px;position:relative;border-radius:8px;cursor:pointer}
ol li::before{content:counter(s);position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;border:1px solid var(--ln);text-align:center;font-size:.8rem;line-height:20px}
ol li.on{background:color-mix(in srgb,var(--ac) 16%,transparent)}ol li.on::before{background:var(--ac);color:#fff;border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g2 h4{margin:0 0 6px}
.pro li::marker{color:var(--ok)}.con li::marker{color:var(--hot)}ul{margin:0;padding-left:20px}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}dt{font-weight:600;color:var(--ac)}dd{margin:0}
input{font:inherit;padding:8px;width:100%;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}nav h3{width:100%}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><h1>Network Concepts Lab</h1><button id="th" aria-label="Toggle theme">Theme</button></header>
<div class="wrap"><nav id="nav" aria-label="Topics"></nav><main id="main"></main></div>
<script>
const T=[
{id:"ring",g:"Topologies",n:"Token Ring (IEEE 802.5)",d:"Physically a star around a MAU, logically a ring. A special frame, the token, decides who may transmit.",
nodes:{M:[400,180,"MAU"],A:[150,60,"A"],B:[650,60,"B"],C:[650,300,"C"],D:[150,300,"D"]},
e:[["M","A"],["M","B"],["M","C"],["M","D"],["A","B",1],["B","C",1],["C","D",1],["D","A",1]],
s:[["A free token circulates the logical ring. Only the device holding the token may transmit, so access is deterministic.",[["A","B","C","D","A"]],[]],
["A wants to send to C. It captures the token and appends its data to it, forming a frame.",[],["A"]],
["A sends the frame to its downstream neighbour. B is not the destination, so it simply retransmits it.",[["A","M","B","M","C"]],["B"]],
["C is the destination: it copies the data, marks the frame as read and passes it on.",[["C","M","D","M","A"]],["C"]],
["The frame returns to A, which sees the read-mark, removes the frame and releases a new free token.",[],["A"]],
["If node D fails but the MAU stays up, the MAU wraps that port and passes traffic on without it.",[["A","M","B"]],["!D","M"]],
["If the MAU itself fails, nothing can pass: a single point of failure. FDDI uses dual rings for failover.",[],["!M"]]],
pros:["Deterministic: maximum wait time is predictable","Can serve as a network backbone","Orderly access, no collisions"],
cons:["Simple ring has a single point of failure","Legacy tech, almost entirely replaced by Ethernet","MAU is a central dependency"],
apps:["Commercial: legacy IBM LANs in banks and offices; FDDI backbones in campuses","Defense/industrial: deterministic timing in older control and factory networks","Other: dual-ring fibre rings (FDDI, SONET-style rings) in telecom metro networks"],
gl:[["IEEE 802.5","Institute of Electrical and Electronics Engineers standard for token ring"],["MAU","Media Access Unit, hub that connects ring nodes"],["FDDI","Fiber Distributed Data Interface, dual-ring fibre standard"],["LAN","Local Area Network"],["CIANA+PS","Confidentiality, Integrity, Availability, Nonrepudiation, Authentication + Privacy, Safety"]]},
{id:"bus",g:"Topologies",n:"Bus",d:"One backbone cable; every node taps into it and samples the signals that flow by.",
nodes:{L:[60,180,"Term."],R:[740,180,"Term."],j1:[200,180,""],j2:[330,180,""],j3:[470,180,""],j4:[600,180,""],A:[200,70,"A"],B:[330,290,"B"],C:[470,70,"C"],D:[600,290,"D"]},
e:[["L","j1"],["j1","j2"],["j2","j3"],["j3","j4"],["j4","R"],["A","j1"],["B","j2"],["C","j3"],["D","j4"]],
s:[["A transmits onto the backbone. The signal travels both up and down the cable.",[["A","j1","L"],["A","j1","j2","j3","j4","R"]],["A"]],
["B, C and D each sample the passing signal. Only D, the addressee, accepts it; the others ignore it.",[],["D"]],
["Node C is powered down. Because signals do not pass through nodes, A to D traffic is unaffected.",[["A","j1","j2","j3","j4","D"]],["!C"]],
["Terminators at each end absorb the signal so it does not reflect back along the cable.",[],["L","R"]],
["The backbone cable or backplane is the single point of failure: a break stops the whole bus.",[],["!j3"]]],
pros:["Adding a node is easy","A node failure rarely affects the rest","Some buses allow hot-swap"],
cons:["Cable/backplane failure disables the whole network","Shared medium: contention and limited length","Harder to isolate faults"],
apps:["Commercial: early Ethernet (10BASE2/5), PCI-style backplanes","Defense: MIL-STD-1553 avionics data bus on military aircraft","Other: CAN bus in cars, Modbus/Profibus in factories"],
gl:[["Backbone","Main shared cable of the bus"],["SPOF","Single Point of Failure"],["CAN","Controller Area Network"]]},
{id:"star",g:"Topologies",n:"Star / Tree",d:"Every device connects to a central switch; switches can connect to other switches to form a tree.",
nodes:{S1:[280,180,"Switch 1"],S2:[580,180,"Switch 2"],A:[100,70,"A"],B:[100,290,"B"],C:[280,320,"C"],D:[740,70,"D"],E:[740,290,"E"],F:[580,320,"F"]},
e:[["S1","A"],["S1","B"],["S1","C"],["S2","D"],["S2","E"],["S2","F"],["S1","S2"]],
s:[["A sends a frame. The switch learns which port each device is on and does not flood every device.",[["A","S1","B"]],["S1"]],
["The switch passes data directly between the two ports only. Other nodes never see it.",[],["B"]],
["Switches link to other switches (a tree). A reaches E via both switches.",[["A","S1","S2","E"]],["S2"]],
["Adding or removing a node only touches its own cable, which makes deployment simple.",[],["C"]],
["If a switch fails, everything attached to it is cut off unless it is redundant.",[],["!S1"]]],
pros:["Fewer cables than full or partial mesh","Easy to deploy; nodes added/removed easily","Fault in one cable affects one node"],
cons:["Central switch is a single point of failure if not redundant","Cable length to the centre","Switch capacity limits scale"],
apps:["Commercial: virtually all office and home Ethernet LANs","Defense: shipboard and base LANs with redundant core switches","Other: hospitals, campuses, data centre top-of-rack designs"],
gl:[["Switch","Layer 2 device forwarding frames between specific ports"],["Tree","Hierarchy of stars joined by switches"]]},
{id:"mesh",g:"Topologies",n:"Mesh",d:"Each device connects to several others, giving redundancy and high availability.",
nodes:{N1:[400,40,"N1"],N2:[690,150,"N2"],N3:[580,310,"N3"],N4:[220,310,"N4"],N5:[110,150,"N5"]},
e:[["N1","N2"],["N1","N3"],["N1","N4"],["N1","N5"],["N2","N3"],["N2","N4"],["N2","N5"],["N3","N4"],["N3","N5"],["N4","N5"]],
s:[["N1 sends to N3 over the direct link.",[["N1","N3"]],["N1","N3"]],
["N2 fails. The network still has many other routes.",[],["!N2"]],
["Traffic reroutes automatically through other nodes (N1, N5, N4, N3). No single point of failure.",[["N1","N5","N4","N3"]],["N5","N4"]],
["Cost: a full mesh of N nodes needs N(N-1)/2 links. 5 nodes need 10; 10 nodes need 45.",[],[]],
["Wireless networks (airport Wi-Fi, mobile phone systems) behave as meshes with overlapping coverage.",[],[]]],
pros:["High level of redundancy and availability","No single point of failure","Scales well in wireless form"],
cons:["Very expensive: N(N-1)/2 cables for a full mesh","Complex to configure and manage"],
apps:["Commercial: data-centre and storage fabrics, airport Wi-Fi, carrier backbones","Defense: tactical mobile ad hoc networks (MANET), resilient command networks","Other: smart cities, disaster-relief and IoT mesh (Zigbee, Thread)"],
gl:[["Full mesh","Every node linked to every other: N(N-1)/2"],["MANET","Mobile Ad Hoc Network"],["Redundancy","Spare paths or devices that avoid a single point of failure"]]},
{id:"wifi",g:"Wireless",n:"Wi-Fi (WLAN, IEEE 802.11)",d:"Devices connect by radio to a wireless access point that bridges to the wired network.",
nodes:{P:[100,70,"Phone"],L:[100,290,"Laptop"],W:[360,180,"WAP"],R:[560,180,"Router"],I:[740,180,"Internet"]},
e:[["P","W",1],["L","W",1],["W","R"],["R","I"]],
s:[["The laptop finds the access point and associates with the network name (SSID).",[["L","W"]],["W"]],
["It authenticates (e.g. WPA2/WPA3) and encryption keys are set up, because radio can be monitored.",[["W","L"]],["L"]],
["Data goes by radio to the WAP, which forwards it onto the wired LAN to the router.",[["L","W","R","I"]],["W"]],
["Replies return the same way. Older devices still connect through backwards compatibility, but only the newest standard (802.11ax) gives top speeds.",[["I","R","W","P"]],["P"]],
["Risks: eavesdropping and radio interference (denial of service). Range extenders cover bigger sites.",[],["!W"]]],
pros:["Mobility and easy deployment","Backwards compatible","No cabling to each device"],
cons:["Monitoring and interference risks","Limited range","Speed requires latest hardware on both ends"],
apps:["Commercial: offices, retail, hospitality, warehouses","Defense: base and hangar LANs with hardened WPA enterprise","Other: homes, healthcare, schools, public hotspots"],
gl:[["WLAN","Wireless Local Area Network"],["WAP","Wireless Access Point"],["SSID","Service Set Identifier"],["WPA","Wi-Fi Protected Access"],["802.11ax","Wi-Fi 6, latest generation named in the text"]]},
{id:"cell",g:"Wireless",n:"Cellular & 5G (CDMA / GSM)",d:"Land is divided into cells, each served by a base station. Neighbouring cells use different frequencies.",
nodes:{P:[90,180,"Phone"],T1:[300,70,"Cell site 1"],T2:[300,290,"Cell site 2"],C:[540,180,"Core"],I:[740,180,"Internet"]},
e:[["P","T1",1],["P","T2",1],["T1","C"],["T2","C"],["C","I"]],
s:[["The phone locates the strongest cell site. Each cell uses its own set of frequencies to avoid interference with neighbours.",[["P","T1"]],["T1"]],
["The network checks the subscriber: GSM keeps identity on a removable SIM; CDMA uses carrier allow-lists, so the carrier approves phones.",[["T1","C"]],["C"]],
["Data flows to the core and out to the internet. 5G uses OFDM across wide bandwidth for speed (up to ~20 Gbps) and low latency.",[["P","T1","C","I"]],["T1"]],
["The user moves. The call hands off to cell site 2 without dropping.",[["P","T2","C"]],["T2"]],
["5G needs many small cells (shorter range) and falls back to 4G where coverage is limited. 5G NR is the radio access technology.",[],["T1","T2"]]],
pros:["Wide geographic coverage with mobility","5G: high speed, low latency; may replace broadband","Frequency reuse supports many users"],
cons:["5G needs many more towers","Mixed legacy generations complicate BYOD security","Radio is open to monitoring/jamming"],
apps:["Commercial: mobile phones, IoT, fixed wireless home internet, smart factories","Defense: private 5G on bases, tactical comms backhaul","Other: telemedicine, connected vehicles, remote monitoring"],
gl:[["CDMA","Code-Division Multiple Access"],["GSM","Global System for Mobile communication"],["SIM","Subscriber Identity Module"],["OFDM","Orthogonal Frequency-Division Multiplexing"],["5G NR","5G New Radio, access technology from 3GPP"],["3GPP","3rd Generation Partnership Project"],["LTE","Long-Term Evolution (4G)"],["RAT","Radio Access Technology"],["BYOD","Bring Your Own Device"]]},
{id:"bt",g:"Wireless",n:"Bluetooth (WPAN, IEEE 802.15)",d:"Short-range open standard for personal area networks.",
nodes:{P:[400,180,"Phone"],H:[140,70,"Headset"],W:[660,70,"Watch"],K:[400,310,"Laptop"]},
e:[["P","H",1],["P","W",1],["P","K",1]],
s:[["Devices discover each other and pair within a few metres.",[["P","H"]],["H"]],
["The phone forms a small personal network with several devices.",[["P","W"],["P","K"]],["W","K"]],
["Audio and data stream over the short-range radio link.",[["P","H"]],["H"]],
["Newer revisions use maximum power only when required, saving battery. Highest speed needs up-to-date equipment at both ends.",[],["P"]]],
pros:["Open standard, built into many devices","Low power","Simple pairing"],
cons:["Short range","Needs modern hardware for top speed","Pairing/eavesdropping risks if poorly configured"],
apps:["Commercial: headsets, wearables, car hands-free, POS devices","Defense: soldier-worn sensors and short-range peripherals","Other: medical monitors, smart home"],
gl:[["WPAN","Wireless Personal Area Network"],["IEEE 802.15","Working group standard for Bluetooth"]]},
{id:"wimax",g:"Wireless",n:"WiMAX (IEEE 802.16)",d:"Broadband wireless access over long distances, replaced largely by LTE/5G.",
nodes:{B:[400,90,"Base station"],N:[700,90,"Backbone"],H:[150,290,"Subscriber"],F:[620,290,"Remote site"]},
e:[["B","N"],["B","H",1],["B","F",1]],
s:[["A base station covers a wide area with microwave radio.",[],["B"]],
["Subscribers connect without laying a cable. Potential over 30 Mbps, typically ~6 Mbps average.",[["H","B"]],["H"]],
["Traffic is carried to the backbone and internet.",[["B","N"]],["N"]],
["Useful where physical infrastructure is difficult or costly, such as aviation; mostly outside the US.",[["F","B"]],["F"]]],
pros:["Reaches places without cable","Cheaper than building physical infrastructure"],
cons:["Slower than wired broadband","Largely replaced by LTE and 5G"],
apps:["Commercial: rural broadband outside the US","Defense: remote site links","Other: aviation and industrial sites"],
gl:[["WiMAX","Worldwide Interoperability for Microwave Access"],["IEEE 802.16","Broadband wireless access standard"]]},
{id:"sat",g:"Wireless",n:"Satellite Network",d:"Broadband delivered via orbiting satellites to remote or sparse areas.",
nodes:{D:[110,300,"Home dish"],S:[400,50,"Satellite"],G:[640,300,"Ground station"],I:[760,160,"Internet"],X:[250,160,"Storm"]},
e:[["D","S",1],["S","G",1],["G","I"]],
s:[["The dish needs line of sight to the satellite and sends a request upward.",[["D","S"]],["D"]],
["The satellite relays it to a ground station connected to the internet.",[["S","G","I"]],["S"]],
["The reply returns the same way. Latency and packet loss are higher than other broadband.",[["I","G","S","D"]],["D"]],
["Extreme weather can degrade or disrupt service.",[],["!X"]]],
pros:["Reaches remote/sparse areas","No local infrastructure"],
cons:["Higher latency and packet loss","Weather disruption","Speed depends on package, provider, line of sight"],
apps:["Commercial: rural ISPs, maritime and airline Wi-Fi","Defense: SATCOM for command and control, ISR links","Other: disaster relief, oil and gas, scientific stations"],
gl:[["SATCOM","Satellite Communications"],["Latency","Delay between sending and receiving"],["ISR","Intelligence, Surveillance, Reconnaissance"]]},
{id:"utp",g:"Transmission media",n:"Twisted pair (UTP / STP)",d:"Insulated copper pairs twisted to reduce electromagnetic interference and crosstalk.",
nodes:{A:[90,180,"Host A"],C:[400,180,"Twisted pair"],B:[710,180,"Host B"],X:[400,50,"EMI"]},
e:[["A","C"],["C","B"]],
s:[["Host A sends an electrical signal across a pair of insulated copper legs (A and B legs).",[["A","C"]],["A"]],
["The twists make interference hit both legs equally, so it cancels at the receiver. Twist count, insulation and conductor decide quality and cost.",[["C","B"]],["C"]],
["UTP has no metal shield, so it picks up interference and can be monitored with the right equipment, but it is cheap and standardised.",[],["!X"]],
["STP wraps the bundle in a grounded foil shield: better protection from interference and monitoring, but costlier, bulkier, larger bend radius.",[],["C"]]],
pros:["UTP: inexpensive, robust to install, well-defined standards","STP: better interference and eavesdrop protection"],
cons:["UTP: susceptible to interference and surveillance","STP: costlier, bulkier, harder to install"],
apps:["Commercial: office/home Ethernet (UTP most common cable type)","Defense: STP in sensitive spaces and TEMPEST-conscious rooms","Other: telephone lines, industrial plants"],
gl:[["UTP","Unshielded Twisted Pair"],["STP","Shielded Twisted Pair"],["EMI","Electromagnetic Interference"],["Crosstalk","Signal leaking between adjacent wires"]]},
{id:"coax",g:"Transmission media",n:"Coaxial cable (RG58)",d:"One thick conductor, insulation, braided shield and outer sheath.",
nodes:{A:[90,180,"Host A"],C:[400,180,"Coax"],B:[710,180,"Host B"],X:[400,50,"EMI"]},
e:[["A","C"],["C","B"]],
s:[["The signal travels on the inner conductive core, which is thicker than twisted-pair wire: more bandwidth, longer runs.",[["A","C"]],["A"]],
["A dielectric insulator separates the core from the braided grounding shield.",[],["C"]],
["The shield blocks outside interference and makes monitoring harder; the sheath protects the cable.",[["C","B"]],["!X"]],
["Costlier than twisted pair and needs a larger bend radius, but robust for specialised uses like cable TV.",[],["B"]]],
pros:["High bandwidth, long runs","Good insulation and shielding"],
cons:["More expensive than twisted pair","Large bend radius, harder to install"],
apps:["Commercial: cable TV and broadband (DOCSIS)","Defense: radar and antenna feeds","Other: CCTV, broadcasting"],
gl:[["Coax","Coaxial cable"],["Dielectric","Insulating layer between core and shield"],["RG58","A common coaxial cable type"]]},
{id:"fiber",g:"Transmission media",n:"Fiber optic",d:"Light pulses travel through glass or plastic fibre instead of electricity on copper.",
nodes:{A:[90,180,"Host A"],T:[250,180,"Transmitter"],C:[400,180,"Fibre core"],R:[550,180,"Receiver"],B:[710,180,"Host B"]},
e:[["A","T"],["T","C"],["C","R"],["R","B"]],
s:[["The host's electrical signal reaches a transmitter (laser/LED tuned to a light frequency).",[["A","T"]],["T"]],
["Pulse-code modulation (PCM) turns electrical impulses into light pulses.",[],["T"]],
["Light is reflected down the core; cladding keeps it inside, like a mirror-lined cardboard tube, even around bends.",[["T","C","R"]],["C"]],
["The receiver converts light back to electrical signals for Host B. Distance depends on laser strength and glass purity.",[["R","B"]],["R"]]],
pros:["Very high bandwidth and distance","Immune to electromagnetic interference","Hard to tap without detection"],
cons:["Costlier terminations and equipment","Fragile, needs careful handling"],
apps:["Commercial: ISP backbones, data centres, FTTH","Defense: secure backbone links, ship and aircraft networks","Other: undersea cables, medical endoscopy"],
gl:[["PCM","Pulse-Code Modulation"],["Cladding","Layer that keeps light in the core"],["FTTH","Fibre To The Home"]]},
{id:"sdn",g:"Architectures",n:"Software-Defined Network (SDN)",d:"Network control is separated from hardware and run as software on virtual infrastructure.",
nodes:{A1:[220,40,"App plane: app"],A2:[580,40,"App plane: app"],C:[400,160,"Controller"],S1:[150,310,"Element 1"],S2:[400,310,"Element 2"],S3:[650,310,"Element 3"]},
e:[["A1","C"],["A2","C"],["C","S1"],["C","S2"],["C","S3"],["S1","S2",1],["S2","S3",1]],
s:[["An application states what it needs (e.g. a new virtual network) through the Northbound API.",[["A1","C"]],["A1"]],
["The controller (control plane) computes routes and policy centrally.",[],["C"]],
["Southbound APIs such as OpenFlow push flow rules to the network elements.",[["C","S1"],["C","S2"],["C","S3"]],["S1","S2","S3"]],
["Data plane: packets are forwarded along the programmed path.",[["S1","S2","S3"]],["S2"]],
["Status flows back up to the controller and apps. All devices can be configured, tested and security-assessed remotely.",[["S2","C","A2"]],["A2"]],
["A new fabric can be defined and tested in minutes, not hours/days; hardware spending can be optimised.",[],[]]],
pros:["Fabric created in minutes","Remote security configuration and assessment","Hardware abstracted away from services"],
cons:["Controller is a high-value target","Complexity of virtualisation","Needs vendor support for OpenFlow"],
apps:["Commercial: cloud data centres, SD-WAN for branches, telecom NFV","Defense: rapidly reconfigurable tactical and cyber-range networks","Other: campus segmentation, research testbeds"],
gl:[["SDN","Software-Defined Network"],["API","Application Programming Interface"],["NBI","Northbound Interface"],["OpenFlow","Vendor-neutral protocol from the Open Networking Foundation"],["A-CPI / D-CPI","Application-/Data-controller Plane Interface"],["VM","Virtual Machine"],["ONF","Open Networking Foundation"]]},
{id:"p2p",g:"Architectures",n:"Peer-to-Peer (P2P)",d:"Equal nodes share resources with each other; no dedicated server.",
nodes:{A:[200,70,"Peer A"],B:[600,70,"Peer B"],C:[600,290,"Peer C"],D:[200,290,"Peer D"]},
e:[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],
s:[["Each peer has its own files and shares them on equal footing.",[["A","B"],["B","A"]],["A","B"]],
["A needs a file and must find who has it, which costs time as peers grow.",[["A","B"],["A","C"],["A","D"]],["A"]],
["It is fetched directly from the peer that holds it. Often faster locally.",[["D","A"]],["D"]],
["If one peer drops, the rest continue: no server to fail.",[],["!C"]]],
pros:["No server single point of failure","Easy and cheap to set up","Fast locally"],
cons:["Unmanageable as resources grow","Hard to locate resources","Weak central control and security policy"],
apps:["Commercial: SOHO file sharing, content delivery assist","Defense: ad hoc field-team sharing","Other: BitTorrent, blockchain networks"],
gl:[["P2P","Peer-to-Peer"],["SOHO","Small Office / Home Office"]]},
{id:"cs",g:"Architectures",n:"Client-Server",d:"A server provides services to clients, such as print, DHCP and DNS.",
nodes:{Sv:[400,90,"Server"],Sb:[640,90,"Standby"],A:[120,300,"Client A"],B:[330,300,"Client B"],C:[540,300,"Client C"],D:[740,300,"Client D"]},
e:[["Sv","A"],["Sv","B"],["Sv","C"],["Sv","D"],["Sv","Sb",1]],
s:[["Client A requests a service (e.g. print a file).",[["A","Sv"]],["A"]],
["The server authenticates the request, accepts and stores the file.",[],["Sv"]],
["It queues the job, prints in turn, deletes the local copy and replies.",[["Sv","A"]],["A"]],
["It serves many clients at once.",[["Sv","B"],["Sv","C"],["Sv","D"]],["Sv"]],
["The server is a central point of failure; redundant servers keep availability.",[["Sv","Sb"]],["!Sv","Sb"]]],
pros:["Central control and security","Servers sized for many clients","Easier management"],
cons:["Server is a single point of failure","Costlier; needs redundancy for availability"],

const $=s=>document.querySelector(s),nav=$("#nav"),main=$("#main");
let cur=T[0],step=0,t=0,play=true,speed=1,cv,cx,last=0,view="topic";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const allGl=()=>{const m={};T.forEach(x=>x.gl.forEach(([a,b])=>m[a]=m[a]||b));return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))};
function buildNav(){let h="",g="";T.forEach(x=>{if(x.g!=g){g=x.g;h+=`<h3>${g}</h3>`}h+=`<button data-id="${x.id}" aria-current="${view=="topic"&&cur==x}">${esc(x.n)}</button>`});
h+=`<h3>Reference</h3><button data-id="_gl" aria-current="${view=="gl"}">All terms (full forms)</button>`;nav.innerHTML=h}
nav.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.id=="_gl"){view="gl";glossary()}else{view="topic";cur=T.find(x=>x.id==b.dataset.id);step=0;t=0;topic()}buildNav()};
function glossary(){main.innerHTML=`<div class="card"><h2>Terminology: full forms</h2><input id="q" placeholder="Filter terms" aria-label="Filter terms"><dl id="dl"></dl></div>`;
const r=(f="")=>$("#dl").innerHTML=allGl().filter(([a,b])=>(a+b).toLowerCase().includes(f.toLowerCase())).map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("");r();$("#q").oninput=e=>r(e.target.value)}
function topic(){const x=cur;main.innerHTML=`<div class="card"><h2>${esc(x.n)}</h2><p class="mute">${esc(x.d)}</p>
<canvas id="cv" role="img" aria-label="Animated simulation of ${esc(x.n)}"></canvas>
<div class="ctl"><button id="pv">Back</button><button id="pl">${play?"Pause":"Play"}</button><button id="nx">Next</button>
<label>Speed <select id="sp"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label></div><div id="cap" aria-live="polite"></div></div>
<div class="card"><h3 style="margin-top:0">Working principle, step by step</h3><ol id="st">${x.s.map((s,i)=>`<li data-i="${i}">${esc(s[0])}</li>`).join("")}</ol></div>
<div class="g2"><div class="card"><h4>Advantages</h4><ul class="pro">${x.pros.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div><div class="card"><h4>Disadvantages</h4><ul class="con">${x.cons.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div></div>
<div class="card"><h4>Where it is deployed</h4><ul>${x.apps.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
<div class="card"><h4>Terms in this topic</h4><dl>${x.gl.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div>`;
cv=$("#cv");cx=cv.getContext("2d");rs();
$("#pv").onclick=()=>{step=(step+x.s.length-1)%x.s.length;t=0};$("#nx").onclick=()=>{step=(step+1)%x.s.length;t=0};
$("#pl").onclick=e=>{play=!play;e.target.textContent=play?"Pause":"Play"};$("#sp").onchange=e=>speed=+e.target.value;
$("#st").onclick=e=>{const l=e.target.closest("li");if(l){step=+l.dataset.i;t=0}}}
function rs(){if(!cv)return;const w=cv.clientWidth,d=devicePixelRatio||1;cv.width=w*d;cv.height=w*.45*d;cv.style.height=w*.45+"px"}
addEventListener("resize",rs);
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
function draw(){if(view!="topic"||!cv)return;const x=cur,S=x.s[step],k=cv.width/800,N=x.nodes;cx.setTransform(k,0,0,k,0,0);cx.clearRect(0,0,800,360);
const ac=col("--ac"),hot=col("--hot"),ln=col("--ln"),ink=col("--ink"),card=col("--card");
cx.lineWidth=2;x.e.forEach(([a,b,d])=>{cx.setLineDash(d?[6,6]:[]);cx.strokeStyle=ln;cx.beginPath();cx.moveTo(N[a][0],N[a][1]);cx.lineTo(N[b][0],N[b][1]);cx.stroke()});cx.setLineDash([]);
const paths=S[1].length&&Array.isArray(S[1][0])?S[1]:S[1].length?[S[1]]:[];
const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
paths.forEach(p=>{const pts=p.map(i=>N[i]),L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const pos=e*L[L.length-1];
cx.strokeStyle=ac;cx.lineWidth=4;cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);let px=pts[0][0],py=pts[0][1];
for(let i=1;i<pts.length;i++){if(pos>=L[i]){cx.lineTo(pts[i][0],pts[i][1]);px=pts[i][0];py=pts[i][1]}else{const f=(pos-L[i-1])/(L[i]-L[i-1]);px=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f;py=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f;cx.lineTo(px,py);break}}
cx.stroke();cx.fillStyle=ac;cx.strokeStyle=card;cx.lineWidth=3;cx.beginPath();cx.arc(px,py,9,0,7);cx.fill();cx.stroke()});
cx.font='600 14px "IBM Plex Sans",system-ui,sans-serif';cx.textAlign="center";cx.textBaseline="middle";
for(const id in N){const[nx,ny,lb]=N[id],bad=S[2].includes("!"+id),hl=bad||S[2].includes(id);
if(!lb){cx.fillStyle=bad?hot:ln;cx.beginPath();cx.arc(nx,ny,bad?9:5,0,7);cx.fill();continue}
const w=cx.measureText(lb).width+24;cx.fillStyle=card;cx.strokeStyle=bad?hot:hl?ac:ln;cx.lineWidth=hl?4:2;
if(hl){cx.shadowColor=bad?hot:ac;cx.shadowBlur=14*(.5+.5*Math.sin(performance.now()/250))}
cx.beginPath();cx.roundRect(nx-w/2,ny-17,w,34,17);cx.fill();cx.stroke();cx.shadowBlur=0;cx.fillStyle=bad?hot:ink;cx.fillText(lb,nx,ny+1)}
$("#cap").textContent=`Step ${step+1} of ${x.s.length}: ${S[0]}`;
document.querySelectorAll("#st li").forEach((l,i)=>l.classList.toggle("on",i==step))}
function loop(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;if(play&&view=="topic"){t+=dt*speed/3.5;if(t>=1.25){t=0;step=(step+1)%cur.s.length}}
if(t>1)t=Math.min(t,1.25);const tt=t;t=Math.min(t,1);draw();t=tt;requestAnimationFrame(loop)}
$("#th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme=="dark";r.dataset.theme=d?"light":"dark"};
buildNav();topic();requestAnimationFrame(loop);
</script></body></html>
